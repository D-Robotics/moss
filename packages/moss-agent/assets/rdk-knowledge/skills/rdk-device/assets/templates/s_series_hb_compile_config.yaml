# hb_compile config — S100 / S100P / S600 (Nash -> .hbm), 天工开物 / OpenExplorer OE
# Run on an x86 Docker host:  hb_compile --config this_file.yaml
# Produces <prefix>.hbm and <prefix>_quantized_model.bc (HBIR, for x86 accuracy compare).
# Structure mirrors rdk_model_zoo (rdk_s branch) mobilenetv2_config.yaml — same shape as the
# X-series template, only the march value, tool name (hb_compile vs hb_mapper) and suffix differ.
model_parameters:
  onnx_model: '../<model>.onnx'
  march: 'nash-e'                 # S100=nash-e / S100P=nash-m / S600=nash-p  (MUST match the board)
  layer_out_dump: False
  working_dir: '../model_output'
  output_model_file_prefix: '<model_name>_nv12'

input_parameters:
  input_type_rt: 'nv12'
  input_type_train: 'bgr'
  input_layout_train: 'NCHW'
  norm_type: 'data_mean_and_scale'
  mean_value: 103.53 116.28 123.675
  scale_value: 0.017429 0.017507 0.017124

calibration_parameters:
  cal_data_dir: '../calibration_data_bgr'   # ~100 images, preprocessed with horizon_tc_ui -> .npy
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  optimize_level: 'O2'
