name: CI

# [CI-only] O153 revert-red: fix reverted in src, new spec must fail on Windows. Do not merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revert-red:
    name: O153 revert-red (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/o153-win-shell-without-pathext.spec.mjs
