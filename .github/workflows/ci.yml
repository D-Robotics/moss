name: CI

# [CI-only] O135 revert-red: fix reverted in src/cli/hooks.ts, O135 specs must fail on Windows. Do not merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revert-red:
    name: O135 revert-red (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: O135 specs on reverted src (each file, keep going)
        shell: pwsh
        run: |
          $files = @(
            'test/o135-missing-command-windows.spec.mjs',
            'test/hooks-fail-closed.spec.mjs',
            'test/o121-safety-block-outcome.spec.mjs',
            'test/cli-hooks-prompt.spec.mjs',
            'test/hooks-event-zh-names.spec.mjs'
          )
          $bad = 0
          foreach ($f in $files) {
            Write-Output "===== $f"
            node $f
            $code = $LASTEXITCODE
            Write-Output "===== $f exit=$code"
            if ($code -ne 0) { $bad++ }
          }
          Write-Output "===== files failing: $bad / $($files.Count)"
          if ($bad -ne 0) { exit 1 }
