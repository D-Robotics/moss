name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (format, lint, typecheck)
        run: npm run check

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22.16.0
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Layout specs drive a Unix PTY through pyte. A missing module used to
      # exit 0; verify now fails unless MOSS_SKIP_PY_LAYOUT=1. Windows has no
      # pty module, so that job sets the skip. Linux and macOS install pyte
      # and run the specs.
      - name: Install pyte for TUI layout specs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if python3 -c 'import pyte'; then
            echo "pyte already installed"
            exit 0
          fi
          python3 -m pip install --user pyte \
            || python3 -m pip install --user --break-system-packages pyte
          python3 -c 'import pyte'

      - name: Test (build + spec suite)
        env:
          MOSS_SKIP_PY_LAYOUT: ${{ runner.os == 'Windows' && '1' || '' }}
        run: npm run test

      - name: CLI smoke
        if: runner.os != 'Windows'
        run: npm run smoke

      # Record this leg's outcome for the Test summary gate (see test-summary).
      - name: Record leg result
        if: always()
        shell: bash
        run: |
          mkdir -p leg-result
          echo "${{ matrix.os }} node ${{ matrix.node }}: ${{ job.status }}" > leg-result/result.txt
          cat leg-result/result.txt

      - name: Upload leg result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-leg-${{ matrix.os }}-${{ matrix.node }}
          path: leg-result/result.txt
          retention-days: 7

  # Not part of the OS matrix. Ubuntu runners ship tmux and macOS runners ship
  # GNU screen, but those sessions do not meet the composer check (and Windows
  # has neither tool). This job installs the tools and opts in.
  real-terminals:
    name: Real terminals (Linux)
    runs-on: ubuntu-latest
    # Non-blocking for now (team decision 2026-10-11): failures stay visible but do not gate merges. Check stays blocking.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Install tmux and GNU screen
        run: sudo apt-get update && sudo apt-get install -y tmux screen

      - name: Build
        run: npm run build

      - name: Real terminal checks
        env:
          MOSS_REAL_TERMINALS: '1'
          MOSS_REAL_TERMINAL_TIMEOUT: '60'
        run: node test/tui-real-terminals.spec.mjs

  # The documented clone → npm ci → npm install -g --install-links path.
  # One job per OS, npm 10 (the npm that ships with Node 22.16). The spec
  # imports dist/, so this job installs first; the spec then clones that
  # tree into a temp prefix. Off in the default test job.
  install-e2e:
    name: Install e2e (${{ matrix.os }}, npm 10)
    runs-on: ${{ matrix.os }}
    # Non-blocking for now (team decision 2026-10-11): failures stay visible but do not gate merges. Check stays blocking.
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Pin npm 10
        run: npm install -g npm@10.9.2

      - name: Install
        run: npm ci

      - name: Documented install into a temp prefix
        env:
          MOSS_INSTALL_E2E: '1'
        run: node test/package-install-e2e.spec.mjs

  # The OS matrix runs the suite on windows-latest, but those specs inject a
  # fake PATH lookup. This job uses the runner's real pwsh 7 and fails if
  # exec would fall through to Windows PowerShell 5.1 or cmd.
  windows-shell:
    name: Windows shell (pwsh 7)
    runs-on: windows-latest
    # Non-blocking for now (team decision 2026-10-11): failures stay visible but do not gate merges. Check stays blocking.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Exec shell is PowerShell 7
        shell: pwsh
        run: |
          $major = $PSVersionTable.PSVersion.Major
          if ($major -lt 7) { throw "runner pwsh $major is older than 7" }
          node --input-type=module -e "import { resolveHostShell } from './dist/utils/host-shell.js'; const shell = resolveHostShell(); if (shell.kind !== 'pwsh') { console.error(shell); process.exit(1); } console.log(shell.kind + ' ' + shell.executable);"

      - name: Host shell and write-sandbox specs
        run: node test/host-shell.spec.mjs && node test/shell-write-sandbox.spec.mjs

  # Single required status for branch protection.
  # Rule (Boss decision on #120, 2026-10-12): Test summary fails if Check fails
  # or if any ubuntu-latest / macos-latest Test leg did not succeed (failure,
  # cancelled, or no recorded result). windows-latest legs are REPORTED here
  # but do NOT block yet: 25 spec files fail on Windows on main (tracked in
  # specs/windows-25-tests.md, each to be fixed or explicitly skipped).
  #
  # TODO(2026-10-15, deadline for #120 / Goal 4): make Windows blocking.
  # Set WINDOWS_BLOCKING to 'true' below by 2026-10-15. Do not extend silently.
  test-summary:
    name: Test summary
    if: always()
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    env:
      WINDOWS_BLOCKING: 'false' # TODO(2026-10-15): flip to 'true'
    steps:
      - name: Download leg results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-leg-*
          path: legs

      - name: Gate on Check + ubuntu/macOS Test (Windows reported only)
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          fail=0
          echo "check=$CHECK_RESULT test(matrix overall)=$TEST_RESULT windows_blocking=$WINDOWS_BLOCKING"
          [ "$CHECK_RESULT" = success ] || { echo "::error::Check: $CHECK_RESULT"; fail=1; }
          {
            echo "## Test summary"
            echo "Blocking: Check, ubuntu-latest, macos-latest. Windows blocking: $WINDOWS_BLOCKING (TODO 2026-10-15: must be true)."
            echo
            echo "| Leg | Result | Blocking |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for os in ubuntu-latest macos-latest windows-latest; do
            for node in 22.16.0 24; do
              f="legs/test-leg-$os-$node/result.txt"
              if [ -f "$f" ]; then r=$(awk '{print $NF}' "$f"); else r=missing; fi
              blocking=yes
              if [ "$os" = windows-latest ] && [ "$WINDOWS_BLOCKING" != true ]; then blocking=no; fi
              echo "$os node $node: $r (blocking=$blocking)"
              echo "| $os node $node | $r | $blocking |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$r" != success ]; then
                if [ "$blocking" = yes ]; then
                  echo "::error::Test ($os, node $node): $r"; fail=1
                else
                  echo "::warning::Test ($os, node $node): $r (non-blocking until 2026-10-15)"
                fi
              fi
            done
          done
          exit $fail
