name: CI

# [CI-only] O153 root-cause probe. Do not merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: O153 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node probe/o153-probe.mjs
