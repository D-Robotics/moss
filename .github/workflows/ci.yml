name: CI

# Per-push CI is one gate: static checks, a build, CLI smoke and the embedding
# examples — the same command developers run locally (`npm run verify`). It is
# designed to finish in about a minute; a 60s budget on the gate itself is
# enforced below. The gate runs as two parallel shards (each ≤ half the stages,
# same budget), and a final "Fast gate" job aggregates them so branch
# protection still has one status. The heavier cross-OS runs live in deep.yml.
# Rationale: docs/design/ci-and-verify.md.
#
# Branch protection: require the single "Fast gate" job (the aggregator) as the
# status check; the shard jobs are its needs.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast gate (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # The gate (not checkout/install) must stay under a minute; exceeding it
      # fails the job so the budget cannot silently rot. Each shard gets the
      # same budget: a shard is half the gate, never a weaker gate.
      VERIFY_BUDGET_SECONDS: '60'
      VERIFY_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      # Restoring node_modules is what makes a <60s wall clock possible: the
      # install step is otherwise the largest fixed cost of the job. The key
      # includes the lockfile hash, and a miss falls back to a real npm ci.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The verify CLI builds explicitly, so the prepare hook's implicit build
      # would be duplicate work. All dependencies needed by the gate are pure
      # JS; the published install path is exercised separately.
      - name: Install (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Warm the static/build caches that the gate itself keeps
      # (node_modules/.cache/verify, .cache). A cold Ubuntu runner needs ~40s
      # for static + ~20s for build, which is environment cold-start rather than
      # gate cost; local runs are warm after the first gate. Warming once
      # before the timed run keeps the 60s budget measuring the command
      # developers actually run, and keeps it deterministic (no dependence on
      # when the immutable node_modules cache was last saved).
      - name: Warm static/build caches (not timed)
        run: |
          node scripts/verify/cli.mjs --stage static
          node scripts/verify/cli.mjs --stage build

      - name: Verify (fast gate shard)
        run: npm run verify

  fast-gate:
    name: Fast gate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - name: Aggregate shard results
        run: node scripts/verify/ci-gate.mjs
