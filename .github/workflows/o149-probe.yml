name: O149 probe (CI-only, do not merge)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: O149 probe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plant an early portability red (sorts before every security spec)
        shell: bash
        run: |
          printf '%s\n' "import test from 'node:test'; import assert from 'node:assert'; test('O149 planted portability red', () => assert.fail('planted'));" > test/aa-00-o149-planted-red.spec.mjs
      - name: Local mode (CI unset), early red + security and ordinary specs
        shell: bash
        continue-on-error: true
        run: |
          set +e
          env -u CI node scripts/run-package-tests.mjs --filter aa- --filter o13 --filter protected --filter hooks --filter exec-git-config --filter cli-doctor 2> >(tee "$RUNNER_TEMP/local.err" >&2)
          echo "runner exit: $?"
          sleep 1
          echo "---- files started:"
          grep -E '^\[test\] .*\.spec\.mjs$' "$RUNNER_TEMP/local.err" | sed 's#.*[\\/]test[\\/]##'
          n=$(grep -cE '^\[test\] .*(aa-o13|[\\/]o13|protected|hook).*\.spec\.mjs$' "$RUNNER_TEMP/local.err")
          echo "O149 VERDICT LOCAL: security specs started after the planted red = $n"
          if [ "$n" -gt 0 ]; then echo 'O149 VERDICT LOCAL: NOT REPRODUCED (security specs ran)'; else echo 'O149 VERDICT LOCAL: REPRODUCED (fail-fast skipped every security spec)'; fi
      - name: CI mode (CI=true), same files
        shell: bash
        continue-on-error: true
        run: |
          set +e
          CI=true node scripts/run-package-tests.mjs --filter aa- --filter o13 --filter protected --filter hooks --filter exec-git-config --filter cli-doctor 2> >(tee "$RUNNER_TEMP/ci.err" >&2)
          echo "runner exit: $?"
          sleep 1
          n=$(grep -cE '^\[test\] .*(aa-o13|[\\/]o13|protected|hook).*\.spec\.mjs$' "$RUNNER_TEMP/ci.err")
          echo "O149 VERDICT CI: security specs started after the planted red = $n"
          grep -E 'file\(s\) failed|^  .*\(exit' "$RUNNER_TEMP/ci.err"
      - name: QA #145 F1 repro (real safety spec names as empty specs, CI unset)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          d="$RUNNER_TEMP/f1"; mkdir -p "$d/test"
          printf '%s\n' "import test from 'node:test'; import assert from 'node:assert'; test('planted', () => assert.fail('planted'));" > "$d/test/aa-00-planted-red.spec.mjs"
          names="egress-redact exec-git-config hooks-fail-closed o101-indirect-writes o103-blocked-outcome o117-git-config-l3-precise o123-git-commit-l3 o135-pretooluse-nonzero-allow o151-workspace-root-cd-not-git-internals o152-exec-capable-and-l3-restore o153-win-shell-without-pathext o158-no-cwd-executable permission-rules safe-child-env"
          for n in $names; do printf '%s\n' "import test from 'node:test'; test('ok', () => {});" > "$d/test/$n.spec.mjs"; done
          (cd "$d" && env -u CI node "$GITHUB_WORKSPACE/scripts/run-package-tests.mjs") 2> "$RUNNER_TEMP/f1.err"
          echo "runner exit: $?"
          grep -E '^\[test\]|^  ' "$RUNNER_TEMP/f1.err"
          ran=0; miss=""
          for n in $names; do if grep -qE "^\[test\] .*[\\/]$n\.spec\.mjs$" "$RUNNER_TEMP/f1.err"; then ran=$((ran+1)); else miss="$miss $n"; fi; done
          echo "O149 F1 VERDICT: $ran of 14 real-name safety specs ran after the planted red; not run:${miss:- none}"
      - name: exec-git-config under Git bash (QA #145 F2)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          node test/exec-git-config.spec.mjs > "$RUNNER_TEMP/egc.out" 2>&1
          echo "exec-git-config exit: $?"
          grep -E '^(not )?ok 17|^# (pass|fail)' "$RUNNER_TEMP/egc.out"
